name: Update language chart

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
  push:
    paths:
      - ".github/workflows/update-language-chart.yml"
      - "scripts/generate_language_chart.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install Pillow
      - name: Generate chart
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USERNAME: achmad-miftahurrojak
        run: python scripts/generate_language_chart.py
      - name: Commit updated chart
        run: |
          if git diff --quiet -- assets/most-used-languages.gif; then
            echo "Language chart is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/most-used-languages.gif
          git commit -m "chore: update most used language chart"
          git push
