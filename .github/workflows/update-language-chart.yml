name: Update language chart

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
  push:
    paths:
      - ".github/workflows/update-language-chart.yml"
      - "scripts/generate_language_chart.py"

permissions:
  contents: write

concurrency:
  group: profile-language-chart
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate compact language chart
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_USERNAME: achmad-miftahurrojak
        run: python scripts/generate_language_chart.py
      - name: Commit updated chart
        run: |
          if git diff --quiet -- assets/most-used-languages.svg; then
            echo "Language chart data is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/most-used-languages.svg
          git commit -m "chore: refresh language chart"
          git push
